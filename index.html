<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Dressup — мой гардероб</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #171717;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    /* -------------------------
       APP
    ------------------------- */

    .app {
      width: 100%;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    .header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 20;
    }

    .header-title {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.7px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 20px;
    }

    .icon-button:active {
      background: #f1f1f1;
    }

    /* -------------------------
       HERO
    ------------------------- */

    .hero {
      padding: 14px 22px 28px;
    }

    .hero-small {
      color: #b8b8b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      margin-bottom: 7px;
    }

    .hero-title {
      font-size: 38px;
      line-height: 1;
      letter-spacing: -2px;
      font-weight: 650;
      margin: 0;
    }

    /* -------------------------
       CATEGORY SECTION
    ------------------------- */

    .category-section {
      margin-bottom: 35px;
    }

    .category-header {
      padding: 0 22px;
      margin-bottom: 13px;
    }

    .category-subtitle {
      color: #b8b8b8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .category-title {
      font-size: 27px;
      font-weight: 500;
      letter-spacing: -1.2px;
      margin: 0;
    }

    .items-wrapper {
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .items-wrapper::-webkit-scrollbar {
      display: none;
    }

    .items {
      display: flex;
      gap: 12px;
      padding: 0 22px 8px;
      width: max-content;
      min-height: 180px;
    }

    /* -------------------------
       ITEM
    ------------------------- */

    .item {
      width: 128px;
      height: 172px;
      position: relative;
      flex-shrink: 0;
      border-radius: 12px;
      background: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
      display: block;
    }

    .item-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 25px;
      height: 25px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .item:hover .item-remove {
      opacity: 1;
    }

    .item-name {
      position: absolute;
      bottom: 7px;
      left: 8px;
      right: 8px;
      font-size: 10px;
      color: #888;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* -------------------------
       ADD ITEM CARD
    ------------------------- */

    .add-card {
      width: 128px;
      height: 172px;
      flex-shrink: 0;
      border: 1px dashed #d8d8d8;
      border-radius: 12px;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #a7a7a7;
      transition: all 0.2s;
    }

    .add-card:active {
      transform: scale(0.97);
      background: #f3f3f3;
    }

    .add-icon {
      font-size: 28px;
      line-height: 1;
      margin-bottom: 8px;
      font-weight: 200;
    }

    .add-text {
      font-size: 11px;
    }

    /* -------------------------
       EMPTY
    ------------------------- */

    .empty-message {
      width: 128px;
      height: 172px;
      flex-shrink: 0;
      border-radius: 12px;
      background: #fafafa;
      color: #c2c2c2;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      font-size: 11px;
      line-height: 1.4;
    }

    /* -------------------------
       FLOATING ADD BUTTON
    ------------------------- */

    .floating-add {
      position: fixed;
      left: 22px;
      bottom: 22px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 0;
      background: #171717;
      color: white;
      font-size: 28px;
      font-weight: 200;
      z-index: 50;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      cursor: pointer;
    }

    .floating-add:active {
      transform: scale(0.94);
    }

    /* -------------------------
       UPLOAD MODAL
    ------------------------- */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 26px 26px 0 0;
      padding: 25px 22px 35px;
      animation: slideUp 0.25s ease;
      max-height: 90vh;
      overflow-y: auto;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .modal-title {
      font-size: 25px;
      font-weight: 600;
      letter-spacing: -1px;
    }

    .close-button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #f4f4f4;
      font-size: 18px;
      cursor: pointer;
    }

    /* -------------------------
       UPLOAD AREA
    ------------------------- */

    .upload-area {
      border: 1.5px dashed #d2d2d2;
      border-radius: 18px;
      height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      background: #fafafa;
      overflow: hidden;
      position: relative;
    }

    .upload-area.has-image {
      border-style: solid;
    }

    .upload-area img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 20px;
    }

    .upload-icon {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .upload-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 5px;
    }

    .upload-description {
      font-size: 12px;
      color: #aaa;
    }

    #fileInput {
      display: none;
    }

    /* -------------------------
       CATEGORY BUTTONS
    ------------------------- */

    .choose-category {
      margin-top: 25px;
    }

    .choose-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .category-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .category-button {
      border: 1px solid #e5e5e5;
      background: white;
      border-radius: 12px;
      padding: 13px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }

    .category-button.active {
      background: #171717;
      color: white;
      border-color: #171717;
    }

    /* -------------------------
       SAVE
    ------------------------- */

    .save-button {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      background: #171717;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .save-button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .save-button:not(:disabled):active {
      transform: scale(0.98);
    }

    /* -------------------------
       PROCESSING
    ------------------------- */

    .processing {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 30px;
      text-align: center;
    }

    .processing.active {
      display: flex;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 2px solid #e5e5e5;
      border-top-color: #171717;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 22px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .processing-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .processing-text {
      font-size: 13px;
      color: #999;
      max-width: 280px;
      line-height: 1.5;
    }

    /* -------------------------
       DESKTOP
    ------------------------- */

    @media (min-width: 700px) {
      .app {
        max-width: 1100px;
        margin: auto;
      }

      .header {
        max-width: 1100px;
        margin: auto;
      }

      .hero {
        padding-top: 35px;
      }

      .modal {
        align-items: center;
      }

      .modal-content {
        border-radius: 26px;
        max-width: 550px;
      }

      .floating-add {
        left: calc(50% - 528px);
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">
      <div class="header-title">Dressup</div>

      <div class="header-actions">
        <button
          class="icon-button"
          onclick="scrollToTop()"
          aria-label="Наверх"
        >
          ↕
        </button>

        <button
          class="icon-button"
          onclick="openUpload()"
          aria-label="Добавить"
        >
          +
        </button>
      </div>
    </header>


    <!-- HERO -->
    <section class="hero">
      <div class="hero-small">MY WARDROBE</div>
      <h1 class="hero-title">Гардероб</h1>
    </section>


    <!-- CATEGORIES -->
    <main id="wardrobe"></main>

  </div>


  <!-- FLOATING ADD -->
  <button
    class="floating-add"
    onclick="openUpload()"
    aria-label="Добавить вещь"
  >
    +
  </button>


  <!-- UPLOAD MODAL -->
  <div class="modal" id="uploadModal">

    <div class="modal-content">

      <div class="modal-top">
        <div class="modal-title">Новая вещь</div>

        <button
          class="close-button"
          onclick="closeUpload()"
        >
          ×
        </button>
      </div>


      <!-- UPLOAD -->
      <label
        class="upload-area"
        id="uploadArea"
        for="fileInput"
      >

        <div id="uploadPlaceholder">
          <div class="upload-icon">＋</div>

          <div class="upload-title">
            Добавить фотографию
          </div>

          <div class="upload-description">
            Лучше фотографировать вещь отдельно
          </div>
        </div>

        <img
          id="previewImage"
          style="display:none;"
          alt="Предпросмотр"
        />

      </label>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
      />


      <!-- CATEGORY -->
      <div class="choose-category">

        <div class="choose-label">
          Категория
        </div>

        <div class="category-buttons">

          <button
            class="category-button"
            data-category="base"
          >
            База
          </button>

          <button
            class="category-button"
            data-category="tops"
          >
            Верх
          </button>

          <button
            class="category-button"
            data-category="bottoms"
          >
            Низ
          </button>

          <button
            class="category-button"
            data-category="shoes"
          >
            Обувь
          </button>

          <button
            class="category-button"
            data-category="outerwear"
          >
            Верхняя одежда
          </button>

          <button
            class="category-button"
            data-category="accessories"
          >
            Аксессуары
          </button>

        </div>

      </div>


      <button
        class="save-button"
        id="saveButton"
        disabled
      >
        Добавить в гардероб
      </button>

    </div>
  </div>


  <!-- PROCESSING -->
  <div
    class="processing"
    id="processing"
  >

    <div class="loader"></div>

    <div class="processing-title">
      Убираем фон
    </div>

    <div class="processing-text">
      AI отделяет вещь от фона. Это может занять немного времени при первом запуске.
    </div>

  </div>


  <!--
    AI BACKGROUND REMOVAL
    Библиотека работает прямо в браузере.
  -->
  <script type="module">

    import {
      removeBackground
    } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";


    /* --------------------------------
       DATA
    -------------------------------- */

    const categories = {

      base: {
        title: "База",
        subtitle: "BASE"
      },

      tops: {
        title: "Верх",
        subtitle: "TOPS"
      },

      bottoms: {
        title: "Низ",
        subtitle: "BOTTOMS"
      },

      shoes: {
        title: "Обувь",
        subtitle: "SHOES"
      },

      outerwear: {
        title: "Верхняя одежда",
        subtitle: "OUTERWEAR"
      },

      accessories: {
        title: "Аксессуары",
        subtitle: "ACCESSORIES"
      }

    };


    let wardrobe =
      JSON.parse(
        localStorage.getItem("dressupWardrobe") || "[]"
      );


    let selectedCategory = null;
    let selectedFile = null;


    /* --------------------------------
       ELEMENTS
    -------------------------------- */

    const modal =
      document.getElementById("uploadModal");

    const fileInput =
      document.getElementById("fileInput");

    const previewImage =
      document.getElementById("previewImage");

    const uploadPlaceholder =
      document.getElementById("uploadPlaceholder");

    const uploadArea =
      document.getElementById("uploadArea");

    const saveButton =
      document.getElementById("saveButton");

    const processing =
      document.getElementById("processing");


    /* --------------------------------
       RENDER
    -------------------------------- */

    function renderWardrobe() {

      const container =
        document.getElementById("wardrobe");

      container.innerHTML = "";


      Object.entries(categories).forEach(
        ([categoryKey, category]) => {

          const section =
            document.createElement("section");

          section.className =
            "category-section";


          const header =
            document.createElement("div");

          header.className =
            "category-header";


          header.innerHTML = `
            <div class="category-subtitle">
              ${category.subtitle}
            </div>

            <h2 class="category-title">
              ${category.title}
            </h2>
          `;


          const wrapper =
            document.createElement("div");

          wrapper.className =
            "items-wrapper";


          const items =
            document.createElement("div");

          items.className =
            "items";


          /* ADD CARD */

          const addCard =
            document.createElement("div");

          addCard.className =
            "add-card";

          addCard.innerHTML = `
            <div class="add-icon">+</div>
            <div class="add-text">Добавить вещь</div>
          `;

          addCard.onclick =
            () => openUpload(categoryKey);


          items.appendChild(addCard);


          /* ITEMS */

          const categoryItems =
            wardrobe.filter(
              item =>
                item.category === categoryKey
            );


          if (categoryItems.length === 0) {

            const empty =
              document.createElement("div");

            empty.className =
              "empty-message";

            empty.innerHTML =
              "Здесь пока<br>ничего нет";

            items.appendChild(empty);

          }


          categoryItems.forEach(item => {

            const card =
              document.createElement("div");

            card.className =
              "item";


            card.innerHTML = `
              <img
                src="${item.image}"
                alt="${item.name || "Вещь"}"
              >

              <button
                class="item-remove"
                title="Удалить"
              >
                ×
              </button>
            `;


            const removeButton =
              card.querySelector(
                ".item-remove"
              );


            removeButton.onclick =
              (event) => {

                event.stopPropagation();

                deleteItem(item.id);

              };


            items.appendChild(card);

          });


          wrapper.appendChild(items);

          section.appendChild(header);

          section.appendChild(wrapper);

          container.appendChild(section);

        }
      );

    }


    /* --------------------------------
       SAVE TO LOCAL STORAGE
    -------------------------------- */

    function saveWardrobe() {

      localStorage.setItem(
        "dressupWardrobe",
        JSON.stringify(wardrobe)
      );

    }


    /* --------------------------------
       DELETE
    -------------------------------- */

    window.deleteItem =
      function(id) {

        wardrobe =
          wardrobe.filter(
            item => item.id !== id
          );

        saveWardrobe();

        renderWardrobe();

      };


    /* --------------------------------
       MODAL
    -------------------------------- */

    window.openUpload =
      function(category = null) {

        modal.classList.add("active");

        resetUpload();

        if (category) {

          selectCategory(category);

        }

      };


    window.closeUpload =
      function() {

        modal.classList.remove("active");

      };


    function resetUpload() {

      selectedFile = null;

      selectedCategory = null;

      fileInput.value = "";

      previewImage.style.display =
        "none";

      previewImage.src = "";

      uploadPlaceholder.style.display =
        "block";

      uploadArea.classList.remove(
        "has-image"
      );

      document
        .querySelectorAll(".category-button")
        .forEach(button => {

          button.classList.remove("active");

        });


      updateSaveButton();

    }


    /* --------------------------------
       FILE UPLOAD
    -------------------------------- */

    fileInput.addEventListener(
      "change",
      event => {

        const file =
          event.target.files[0];

        if (!file) return;

        selectedFile = file;


        const url =
          URL.createObjectURL(file);


        previewImage.src = url;

        previewImage.style.display =
          "block";

        uploadPlaceholder.style.display =
          "none";

        uploadArea.classList.add(
          "has-image"
        );


        updateSaveButton();

      }
    );


    /* --------------------------------
       CATEGORY
    -------------------------------- */

    document
      .querySelectorAll(".category-button")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            selectCategory(
              button.dataset.category
            );

          }
        );

      });


    function selectCategory(category) {

      selectedCategory =
        category;


      document
        .querySelectorAll(".category-button")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.category ===
              category
          );

        });


      updateSaveButton();

    }


    /* --------------------------------
       SAVE BUTTON
    -------------------------------- */

    function updateSaveButton() {

      saveButton.disabled =
        !selectedFile ||
        !selectedCategory;

    }


    saveButton.addEventListener(
      "click",
      async () => {

        if (
          !selectedFile ||
          !selectedCategory
        ) return;


        processing.classList.add(
          "active"
        );


        try {

          /*
            Удаляем фон.
            Результат — PNG с прозрачностью.
          */

          const resultBlob =
            await removeBackground(
              selectedFile
            );


          /*
            Превращаем Blob
            в data URL, чтобы хранить
            изображение в localStorage.
          */

          const imageData =
            await blobToDataURL(
              resultBlob
            );


          const newItem = {

            id:
              Date.now() +
              Math.random(),

            category:
              selectedCategory,

            image:
              imageData,

            name:
              selectedFile.name

          };


          wardrobe.push(
            newItem
          );


          saveWardrobe();

          renderWardrobe();

          closeUpload();

        } catch (error) {

          console.error(error);

          alert(
            "Не получилось удалить фон. Попробуй другое фото."
          );

        } finally {

          processing.classList.remove(
            "active"
          );

        }

      }
    );


    /* --------------------------------
       BLOB → DATA URL
    -------------------------------- */

    function blobToDataURL(blob) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();

          reader.onload =
            () => resolve(
              reader.result
            );

          reader.onerror =
            reject;

          reader.readAsDataURL(
            blob
          );

        }
      );

    }


    /* --------------------------------
       CLOSE MODAL BY BACKGROUND
    -------------------------------- */

    modal.addEventListener(
      "click",
      event => {

        if (
          event.target === modal
        ) {

          closeUpload();

        }

      }
    );


    /* --------------------------------
       TOP
    -------------------------------- */

    window.scrollToTop =
      function() {

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      };


    /* --------------------------------
       INITIAL
    -------------------------------- */

    renderWardrobe();

  </script>

</body>
</html>
